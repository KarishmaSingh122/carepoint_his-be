spring.application.name=carepoint
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.initialization-mode=always
spring.datasource.platform=postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.profiles.active=dev
logging.level.liquibase=WARN
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
app.default-password=Sumasoft@123

security.jwt.issuer=https://carepoint.com
security.jwt.audience=carepoint-api
security.jwt.secret-base64=${CAREPOINT_JWT_SECRET_BASE64}
security.jwt.access-token-ttl=PT10M
security.jwt.refresh-token-ttl=P7D

security.cookie.secure=${CAREPOINT_COOKIE_SECURE:false}
security.cookie.same-site=Lax
security.cookie.access-name=access_token
security.cookie.refresh-name=refresh_token
security.cookie.access-path=/
security.cookie.refresh-path=/

onehcx.auth.base-url= ${ONEHCX_AUTH_BASE_URL:http://localhost:8080}
onehcx.encryption-key= ${ONEHCX_ENCRYPTION_KEY:rK8vQ2mN7xLp5TzW9aBc4DgH6jFs1YwE3uIo0VnXbZQ=}